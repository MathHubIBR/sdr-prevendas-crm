<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM de Pré-Vendas (SDR)</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>CRM de Pré-Vendas</h1>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="status" id="db-status">Carregando banco de dados...</span>
      <span class="status" id="file-link-status"></span>
      <button class="small" id="btn-vincular-arquivo" style="background:#fff">🔗 Vincular arquivo</button>
      <button class="small" id="btn-nova-interacao" style="background:#fff">+ Interação</button>
      <button class="small" id="btn-exportar" style="background:#fff">Exportar backup</button>
      <label class="small" style="background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; color:#1f2430; font-weight:normal;">
        Importar backup
        <input type="file" id="input-importar" accept=".db" style="display:none" />
      </label>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main>
    <div id="view-container">
      <div class="empty-state">Carregando...</div>
    </div>
  </main>

  <script src="js/lib/sql-wasm-data.js"></script>
  <script src="js/lib/sql-wasm.js"></script>
  <script src="js/util.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/filestore.js"></script>
  <script src="js/db.js"></script>
  <script src="js/views/followup.js"></script>
  <script src="js/views/accounts.js"></script>
  <script src="js/views/interactions.js"></script>
  <script src="js/views/funnel.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
